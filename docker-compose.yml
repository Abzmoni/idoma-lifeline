version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: safepath-db
    environment:
      POSTGRES_USER: safepath_user
      POSTGRES_PASSWORD: safepath_password
      POSTGRES_DB: safepath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
