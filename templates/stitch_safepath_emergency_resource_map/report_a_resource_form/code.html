<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Resource - SafePath</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#3e4755",
                        "surface-bright": "#fff8f6",
                        "surface-container-highest": "#f7ddd4",
                        "outline": "#8d7165",
                        "on-background": "#261913",
                        "inverse-primary": "#ffb595",
                        "surface": "#fff8f6",
                        "surface-container-high": "#fce3d9",
                        "secondary": "#565f6d",
                        "secondary-fixed-dim": "#bec7d7",
                        "error-container": "#ffdad6",
                        "outline-variant": "#e1bfb2",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#3c2d27",
                        "on-secondary-fixed": "#131c28",
                        "tertiary-container": "#0076d2",
                        "tertiary-fixed": "#d4e3ff",
                        "on-surface-variant": "#594137",
                        "primary-container": "#c64f00",
                        "on-primary-container": "#fffbff",
                        "on-error": "#ffffff",
                        "primary": "#9e3d00",
                        "on-tertiary-fixed-variant": "#004883",
                        "primary-fixed-dim": "#ffb595",
                        "tertiary-fixed-dim": "#a4c9ff",
                        "inverse-on-surface": "#ffede7",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#dae3f4",
                        "primary-fixed": "#ffdbcc",
                        "secondary-container": "#dae3f4",
                        "on-secondary-container": "#5c6573",
                        "surface-dim": "#eed5cb",
                        "surface-variant": "#f7ddd4",
                        "on-tertiary-fixed": "#001c39",
                        "on-secondary": "#ffffff",
                        "background": "#fff8f6",
                        "surface-container-low": "#fff1ec",
                        "on-tertiary-container": "#fdfcff",
                        "tertiary": "#005da8",
                        "surface-container": "#ffe9e1",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#261913",
                        "on-primary-fixed-variant": "#7c2e00",
                        "surface-tint": "#a23f00",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#351000"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-mobile": "16px",
                        "touch-target": "48px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "base": "4px"
                    },
                    fontFamily: {
                        "headline-lg": ["Public Sans"],
                        "data-sm": ["IBM Plex Mono"],
                        "body-md": ["Public Sans"],
                        "label-caps": ["Public Sans"],
                        "data-lg": ["IBM Plex Mono"],
                        "body-lg": ["Public Sans"],
                        "headline-md": ["Public Sans"],
                        "headline-sm": ["Public Sans"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-sm": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "data-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .type-chip input[type="radio"]:checked + div {
            background-color: #E8600C; /* Using literal spec orange for active */
            color: #FFFFFF;
            border-color: #E8600C;
        }
        .type-chip input[type="radio"]:checked + div .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        body { background-color: #F1F2EE; } /* Level 0 Background */
    </style>
</head>
<body class="text-on-background font-body-md antialiased pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-touch-target bg-surface border-b border-outline-variant flat no shadows">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="flex items-center justify-center text-primary">
<span class="material-symbols-outlined">signal_cellular_alt</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">SafePath</h1>
</div>
<div class="flex items-center gap-4 text-primary">
<button aria-label="Profile" class="flex items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas - Suppressing side/bottom nav per logic (Task Focused/Transactional) -->
<main class="pt-20 px-margin-mobile md:px-margin-desktop max-w-lg mx-auto md:max-w-2xl">
<div class="mb-6">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Report Incident</h2>
<p class="text-on-surface-variant">Log a new resource or hazard into the regional registry. Accurate reporting saves lives.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Type Selection Grid -->
<fieldset class="bg-surface p-4 border border-outline-variant rounded">
<legend class="font-label-caps text-label-caps text-on-surface mb-3 uppercase">Resource Classification *</legend>
<div class="grid grid-cols-2 md:grid-cols-3 gap-3">
<label class="type-chip cursor-pointer">
<input class="sr-only" name="resource_type" required="" type="radio" value="shelter"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline-variant bg-surface-container-lowest text-on-surface rounded transition-colors h-24 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[32px] mb-2" data-icon="home">home</span>
<span class="font-data-sm text-data-sm uppercase tracking-wide">Shelter</span>
</div>
</label>
<label class="type-chip cursor-pointer">
<input class="sr-only" name="resource_type" type="radio" value="water"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline-variant bg-surface-container-lowest text-on-surface rounded transition-colors h-24 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[32px] mb-2" data-icon="water_drop">water_drop</span>
<span class="font-data-sm text-data-sm uppercase tracking-wide">Water</span>
</div>
</label>
<label class="type-chip cursor-pointer">
<input class="sr-only" name="resource_type" type="radio" value="medical"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline-variant bg-surface-container-lowest text-on-surface rounded transition-colors h-24 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[32px] mb-2" data-icon="local_hospital">local_hospital</span>
<span class="font-data-sm text-data-sm uppercase tracking-wide">Medical</span>
</div>
</label>
<label class="type-chip cursor-pointer">
<input class="sr-only" name="resource_type" type="radio" value="food"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline-variant bg-surface-container-lowest text-on-surface rounded transition-colors h-24 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[32px] mb-2" data-icon="restaurant">restaurant</span>
<span class="font-data-sm text-data-sm uppercase tracking-wide">Food</span>
</div>
</label>
<label class="type-chip cursor-pointer">
<input class="sr-only" name="resource_type" type="radio" value="safe_zone"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline-variant bg-surface-container-lowest text-on-surface rounded transition-colors h-24 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[32px] mb-2" data-icon="gpp_good">gpp_good</span>
<span class="font-data-sm text-data-sm uppercase tracking-wide">Safe Zone</span>
</div>
</label>
<label class="type-chip cursor-pointer">
<input class="sr-only" name="resource_type" type="radio" value="hazard"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline-variant bg-surface-container-lowest text-on-surface rounded transition-colors h-24 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[32px] mb-2 text-error" data-icon="warning">warning</span>
<span class="font-data-sm text-data-sm uppercase tracking-wide">Hazard</span>
</div>
</label>
</div>
</fieldset>
<!-- Text Fields -->
<div class="space-y-4">
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="resource_name">Resource Name *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface p-3 rounded focus:ring-2 focus:ring-[#E8600C] focus:border-transparent font-body-md" id="resource_name" name="resource_name" placeholder="e.g. Central High School Gym" required="" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="description">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface p-3 rounded focus:ring-2 focus:ring-[#E8600C] focus:border-transparent font-body-md" id="description" name="description" placeholder="Capacity, current status, urgent needs..." rows="3"></textarea>
</div>
</div>
<!-- Location Map Embed -->
<fieldset class="bg-surface border border-outline-variant rounded overflow-hidden">
<div class="p-4 border-b border-outline-variant bg-surface-container-low flex justify-between items-center">
<legend class="font-label-caps text-label-caps text-on-surface uppercase">Location Fix *</legend>
<span class="font-data-sm text-data-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">my_location</span> GPS Active
                    </span>
</div>
<div class="relative w-full h-48 bg-surface-container-highest">
<!-- Placeholder Map Image -->
<img class="w-full h-full object-cover" data-alt="A detailed digital map interface showing a grid of city streets with a functional, high-contrast aesthetic typical of emergency response software. The map uses stark whites, pale stones, and deep ink colors for roads, with no decorative elements. A bold, singular orange pin marker is situated near the center." data-location="Seattle" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhv2IXj79n3SHmi-cIWWKHe7QQNXqSDx9GpCMF0TDQvB8MGdpIjLcHXcILEZo3E2G9LYBHYJdZqqvYHkCJGrW3Ug_v0TfaysJB6Ph2iyYTVMWSpsviSgIYf6_us-cjhrbW-hYOB_QMp8T_tYykVPwyHsOyhbgoc285zNU0iWH9qyYkSvmQdikncBQ41O-0yk37b-tCgOU131E_y02RI7WiEI-cV02hh5eLakYSY1RlFVH4xK8Z66Pe-g"/>
<!-- Simulated Map Overlay/Crosshair -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative flex flex-col items-center">
<!-- Draggable Pin Visual -->
<div class="w-8 h-8 bg-[#E8600C] rounded-t-full rounded-bl-full rotate-45 flex items-center justify-center shadow-md transform -translate-y-4">
<span class="material-symbols-outlined -rotate-45 text-white text-[16px]" style="font-variation-settings: 'FILL' 1;">adjust</span>
</div>
<div class="w-2 h-2 bg-on-background rounded-full absolute bottom-[-4px]"></div>
</div>
</div>
</div>
<div class="p-3 bg-surface-container-lowest">
<p class="font-data-sm text-data-sm text-on-surface-variant text-center">Drag map to position pin accurately.</p>
</div>
</fieldset>
<!-- Optional Coordinator Contact -->
<div class="bg-surface-container p-4 border border-outline-variant rounded">
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="contact_phone">Coordinator Phone (Optional)</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface p-3 rounded focus:ring-2 focus:ring-[#E8600C] focus:border-transparent font-data-lg mb-2" id="contact_phone" name="contact_phone" placeholder="+1 (555) 000-0000" type="tel"/>
<p class="font-data-sm text-data-sm text-on-surface-variant flex items-start gap-1">
<span class="material-symbols-outlined text-[16px] mt-0.5">visibility_off</span>
                    Only visible to coordinators, never shown publicly.
                </p>
</div>
<!-- Spacer for sticky button on mobile -->
<div class="h-24 md:h-12"></div>
<!-- Sticky Submit Button -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface border-t border-outline-variant md:relative md:border-none md:p-0 md:bg-transparent z-40">
<button class="w-full h-14 bg-[#E8600C] text-white font-label-caps text-label-caps uppercase tracking-wider rounded flex justify-center items-center gap-2 hover:bg-[#c64f00] active:scale-[0.98] transition-transform" type="submit">
<span class="material-symbols-outlined">send</span>
                    Send Report
                </button>
</div>
</form>
</main>
</body></html>
