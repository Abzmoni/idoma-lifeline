<!DOCTYPE html>

<html class="h-full bg-background dark:bg-background" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafePath - Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#3e4755",
                        "primary-container": "#c64f00",
                        "outline-variant": "#e1bfb2",
                        "on-surface": "#261913",
                        "surface-bright": "#fff8f6",
                        "on-error": "#ffffff",
                        "surface-container-low": "#fff1ec",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#d4e3ff",
                        "primary-fixed": "#ffdbcc",
                        "on-primary-fixed": "#351000",
                        "background": "#fff8f6", // #F1F2EE equivalent based on prompt vs config
                        "secondary-fixed": "#dae3f4",
                        "surface-container-highest": "#f7ddd4",
                        "on-surface-variant": "#594137",
                        "secondary": "#565f6d",
                        "on-error-container": "#93000a",
                        "surface": "#ffffff", // Standard card surface
                        "on-primary-container": "#fffbff",
                        "tertiary": "#005da8",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#7c2e00",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#f7ddd4",
                        "on-tertiary-fixed-variant": "#004883",
                        "on-secondary-fixed": "#131c28",
                        "surface-container-high": "#fce3d9",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#a23f00",
                        "secondary-container": "#dae3f4",
                        "on-tertiary-container": "#fdfcff",
                        "primary": "#E8600C", // Override for Signal Orange
                        "on-tertiary-fixed": "#001c39",
                        "tertiary-fixed-dim": "#a4c9ff",
                        "inverse-on-surface": "#ffede7",
                        "surface-dim": "#eed5cb",
                        "primary-fixed-dim": "#ffb595",
                        "surface-container": "#ffe9e1",
                        "outline": "#CFCBC0", // Override for structural border
                        "on-secondary-container": "#5c6573",
                        "on-tertiary": "#ffffff",
                        "on-background": "#261913",
                        "inverse-surface": "#3c2d27",
                        "secondary-fixed-dim": "#bec7d7",
                        "inverse-primary": "#ffb595",
                        "tertiary-container": "#0076d2"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "none": "0px" // Forcing sharp corners for civic look
                    },
                    spacing: {
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "touch-target": "48px"
                    },
                    fontFamily: {
                        "body-md": ["Public Sans", "sans-serif"],
                        "body-lg": ["Public Sans", "sans-serif"],
                        "label-caps": ["Public Sans", "sans-serif"],
                        "headline-sm": ["Public Sans", "sans-serif"],
                        "headline-md": ["Public Sans", "sans-serif"],
                        "data-lg": ["IBM Plex Mono", "monospace"],
                        "headline-lg": ["Public Sans", "sans-serif"],
                        "data-sm": ["IBM Plex Mono", "monospace"]
                    },
                    fontSize: {
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "data-lg": ["16px", { lineHeight: "24px", fontWeight: "500" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "data-sm": ["13px", { lineHeight: "18px", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Force neutral stone-gray background per prompt */
        body {
            background-color: #F1F2EE !important;
        }
        /* Material symbols base class */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Strict form styling */
        input[type="text"], input[type="password"], input[type="tel"] {
            border: 1px solid #CFCBC0 !important;
            border-radius: 0 !important;
            height: 48px !important;
            padding: 0 16px !important;
            background-color: #FFFFFF !important;
            color: #261913 !important;
        }
        input:focus {
            outline: none !important;
            border: 2px solid #E8600C !important;
            box-shadow: none !important;
            padding: 0 15px !important; /* adjust for border width to prevent jump */
        }
        
        button {
            border-radius: 0 !important;
            height: 48px !important;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased font-body-md text-on-background">
<!-- Plain, centered login card -->
<main class="w-full max-w-[400px] bg-surface border border-outline bg-white shadow-none">
<!-- Level 2 Active/Critical border indicator at the top -->
<div class="h-1 w-full bg-primary"></div>
<div class="p-8">
<!-- Header -->
<div class="mb-8">
<div class="flex items-center gap-2 mb-4">
<span aria-hidden="true" class="material-symbols-outlined text-primary text-2xl">signal_cellular_alt</span>
<h1 class="font-headline-md text-headline-md text-on-surface">SafePath</h1>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface-variant">Authorized Personnel Only</h2>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Phone Field -->
<div>
<label class="block font-label-caps text-label-caps uppercase text-on-surface-variant mb-2" for="phone">
                        Phone Number
                    </label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">phone</span>
</span>
<input class="block w-full font-data-lg text-data-lg pl-10" id="phone" name="phone" placeholder="+1 (000) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-caps text-label-caps uppercase text-on-surface-variant mb-2" for="password">
                        Access Code
                    </label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">dialpad</span>
</span>
<input class="block w-full font-data-lg text-data-lg pl-10" id="password" name="password" required="" type="password"/>
</div>
</div>
<!-- Action -->
<div class="pt-4">
<button class="w-full flex justify-center items-center bg-primary hover:bg-on-surface text-on-primary font-label-caps text-label-caps uppercase tracking-wider transition-colors duration-150" type="submit">
                        Log in
                    </button>
</div>
</form>
<!-- Footer Admin Note -->
<div class="mt-8 pt-4 border-t border-outline flex items-start gap-2">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant mt-0.5">info</span>
<p class="font-data-sm text-data-sm text-on-surface-variant">
                    System access is restricted to verified command operatives. For credential recovery, contact Regional HQ.
                </p>
</div>
</div>
</main>
</body></html>
