services:
  - type: web
    name: idoma-lifeline-api
    env: node
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && node tools/build-demo.cjs
    startCommand: node backend/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safepath-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: safepath-db
    databaseName: safepath
    user: safepath_user
    plan: free
