services:
  - type: web
    name: idoma-lifeline-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safepath-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production

databases:
  - name: safepath-db
    databaseName: safepath
    user: safepath_user
    plan: free
